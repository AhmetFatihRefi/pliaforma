# Pliaforma — İzleme yığını (Prometheus + Grafana). BAĞIMSIZ ve OPSİYONEL: uygulamaya dokunmaz.
# Native (dotnet run) backend'i host.docker.internal:5132/metrics üzerinden izler.
#
# GÜVENLİK (Sprint 31B-1):
#   - Portlar yalnız LOOPBACK'e (127.0.0.1) bind edilir → host dışına AÇILMAZ.
#   - Grafana admin parolası ENV ZORUNLU (GF_ADMIN_PASSWORD); default admin/admin YOK.
#   - Anonim erişim ve embedding VARSAYILAN KAPALI (gerekirse env ile açın).
#   - PROD: Bu yığın pilotta ÇALIŞTIRILMAZ (varsayım). Çalıştırılırsa loopback + reverse-proxy + auth arkasında olmalı.
#
# Başlatma (parola zorunlu):
#   GF_ADMIN_PASSWORD='guclu-bir-parola' docker compose -f docker-compose.monitoring.yml up -d
#   docker compose -f docker-compose.monitoring.yml down
#
#   Grafana:    http://127.0.0.1:3001   (kullanıcı: admin, parola: GF_ADMIN_PASSWORD)
#   Prometheus: http://127.0.0.1:9090
#
# Not: Grafana 3001'e map'lendi (frontend :3000 ile çakışmasın). Prometheus 9090.

name: pliaforma-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pliaforma-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # yalnız loopback — host dışına açılmaz
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux uyumu (Docker Desktop'ta zaten çözülür)

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pliaforma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      # Parola ENV ZORUNLU — tanımsızsa compose hata verir (default admin/admin YOK).
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD tanımlı olmalı (örn. GF_ADMIN_PASSWORD=... docker compose ...)}
      # Anonim erişim + embedding VARSAYILAN KAPALI. Lokal iframe gömme için env ile açın:
      #   GF_ANON_ENABLED=true GF_ALLOW_EMBEDDING=true docker compose -f docker-compose.monitoring.yml up -d
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: ${GF_ALLOW_EMBEDDING:-false}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # yalnız loopback — host dışına açılmaz
    depends_on:
      - prometheus

volumes:
  promdata:
  grafanadata:
