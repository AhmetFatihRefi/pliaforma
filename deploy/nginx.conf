# Pliaforma — production nginx (same-origin tek giriş, HTTPS zorunlu).
# /        → frontend (Next.js)
# /api/    → backend (.NET API)   — refresh cookie same-origin çalışır
# /health  → backend health
# /metrics → DIŞARI KAPALI (defansif 404; Prometheus yalnız internal/loopback'ten okumalı)
#
# TLS: gerçek sertifikalar deploy/certs/ altında olmalı (repo'da YOK):
#   deploy/certs/fullchain.pem , deploy/certs/privkey.pem
# Sertifika alımı (örnek, certbot standalone — stack kapalıyken):
#   certbot certonly --standalone -d your-domain.com
#   cp /etc/letsencrypt/live/your-domain.com/{fullchain,privkey}.pem deploy/certs/
# Detay: pliaformaApi/docs/PILOT-DEPLOY-DRY-RUN.md

upstream pliaforma_frontend {
    server frontend:3000;
}

upstream pliaforma_backend {
    server backend:8080;
}

# ---- HTTP (80): her şeyi HTTPS'e yönlendir ----
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Tüm trafik HTTPS'e (kalıcı yönlendirme).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (443): asıl uygulama ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 10m;   # istek gövde limiti (büyük yük/DoS yüzeyini sınırlar)
    server_tokens off;          # nginx sürümünü gizle

    # Güvenlik başlıkları (tüm yanıtlara; hata yanıtları dahil "always").
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: HTTPS'i zorunlu kılar. BAŞTA KISA max-age (sticky'dir; TLS doğrulanmadan uzatmayın).
    # TLS uçtan uca doğrulandıktan sonra max-age=31536000 (+ ileride preload) yapın.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    # NOT: Content-Security-Policy bilinçli eklenmedi (Sprint 31B-2 — Next.js inline tema scripti nonce/hash ister).

    # Gerçek istemci IP'si (backend ForwardedHeaders ile okur → rate limit doğru çalışır).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Defansif: /metrics dışarıya KAPALI (Prometheus internal/loopback'ten okur; public scrape engellenir).
    location = /metrics {
        return 404;
    }

    # API — URI korunur (/api/... olduğu gibi backend'e gider).
    location /api/ {
        proxy_pass http://pliaforma_backend;
    }

    # Health
    location = /health {
        proxy_pass http://pliaforma_backend;
    }

    # Frontend (geri kalan her şey)
    location / {
        proxy_pass http://pliaforma_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
