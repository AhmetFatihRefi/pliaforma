# Pliaforma — production nginx (same-origin tek giriş, HTTPS zorunlu).
# /        → frontend (Next.js)
# /api/    → backend (.NET API)   — refresh cookie same-origin çalışır
# /health  → backend health
# /metrics → DIŞARI KAPALI (defansif 404; Prometheus yalnız internal/loopback'ten okumalı)
#
# ---- DOMAIN / CANONICAL HOST (Sprint 49) ------------------------------------------------------------
# Refresh cookie host-only + SameSite=Strict + Path=/api/auth → frontend ve API AYNI origin'den servis
# edilmeli. Bu yüzden TEK canonical host vardır: pliaforma.com. www./app./api. → 301 pliaforma.com.
#   pliaforma.com       → uygulama (landing + panel + /api same-origin)   [CANONICAL]
#   www.pliaforma.com   → 301 https://pliaforma.com
#   app.pliaforma.com   → 301 https://pliaforma.com   (ayrı frontend origin'i pilotta KULLANILMAZ)
#   api.pliaforma.com   → 301 https://pliaforma.com   (ayrı API origin'i = cross-origin cookie; post-pilot)
# Canonical host'u değiştirmek isterseniz (ör. app.pliaforma.com): aşağıdaki server_name'leri ve
# PUBLIC_ORIGIN env'ini birlikte güncelleyin. İki farklı origin'i (app + api) AYNI anda aktif ETMEYİN.
#
# TLS: gerçek sertifikalar deploy/certs/ altında olmalı (repo'da YOK) — SAN tüm host'ları kapsamalı:
#   deploy/certs/fullchain.pem , deploy/certs/privkey.pem
# Sertifika alımı (örnek, certbot standalone — stack kapalıyken; Cloudflare DNS-only/gri bulut olmalı):
#   certbot certonly --standalone \
#     -d pliaforma.com -d www.pliaforma.com -d app.pliaforma.com -d api.pliaforma.com
#   cp /etc/letsencrypt/live/pliaforma.com/{fullchain,privkey}.pem deploy/certs/
# Detay: pliaformaApi/docs/PILOT-DEPLOY-DRY-RUN.md

upstream pliaforma_frontend {
    server frontend:3000;
}

upstream pliaforma_backend {
    server backend:8080;
}

# ---- HTTP (80): her şeyi HTTPS'e yönlendir ----
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Tüm trafik HTTPS'e (kalıcı yönlendirme; host korunur → HTTPS katmanında canonical'e düşer).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (443) non-canonical: www./app./api. → canonical apex (301) ----
# Same-origin cookie tutarlılığı için tüm alt alanlar tek canonical host'a toplanır.
server {
    listen 443 ssl;
    http2 on;
    server_name www.pliaforma.com app.pliaforma.com api.pliaforma.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    server_tokens off;

    return 301 https://pliaforma.com$request_uri;
}

# ---- HTTPS (443) canonical: asıl uygulama (pliaforma.com) ----
server {
    listen 443 ssl default_server;
    http2 on;
    server_name pliaforma.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 10m;   # istek gövde limiti (büyük yük/DoS yüzeyini sınırlar)
    server_tokens off;          # nginx sürümünü gizle

    # Güvenlik başlıkları (tüm yanıtlara; hata yanıtları dahil "always").
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: HTTPS'i zorunlu kılar. BAŞTA KISA max-age (sticky'dir; TLS doğrulanmadan uzatmayın).
    # TLS uçtan uca doğrulandıktan sonra max-age=31536000 (+ ileride preload) yapın.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    # CSP (Sprint 31C-2): nginx CSP ÜRETMEZ — Next.js proxy (src/proxy.ts) per-request nonce + enforce ile
    # sahiplenir (CSP_MODE=report-only|enforce|disabled). Burada CSP eklemek ÇİFT HEADER çakışması yaratır →
    # bilinçli olarak YOK. frame-ancestors CSP'de; X-Frame-Options yukarıda defense-in-depth olarak kalır.

    # Gerçek istemci IP'si (backend ForwardedHeaders ile okur → rate limit doğru çalışır).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Defansif: /metrics dışarıya KAPALI (Prometheus internal/loopback'ten okur; public scrape engellenir).
    location = /metrics {
        return 404;
    }

    # API — URI korunur (/api/... olduğu gibi backend'e gider).
    location /api/ {
        proxy_http_version 1.1;   # gövdesiz POST'lar (ör. logout) HTTP/1.0'da Content-Length'siz gider → 400; 1.1 düzeltir
        proxy_pass http://pliaforma_backend;
    }

    # Health
    location = /health {
        proxy_http_version 1.1;
        proxy_pass http://pliaforma_backend;
    }

    # Frontend (geri kalan her şey)
    location / {
        proxy_pass http://pliaforma_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
