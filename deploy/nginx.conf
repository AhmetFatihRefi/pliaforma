# Pliaforma — production nginx (same-origin tek giriş).
# /        → frontend (Next.js)
# /api/    → backend (.NET API)   — refresh cookie same-origin çalışır
# /health  → backend health

upstream pliaforma_frontend {
    server frontend:3000;
}

upstream pliaforma_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;   # istek gövde limiti (büyük yük/DoS yüzeyini sınırlar)
    server_tokens off;          # nginx sürümünü gizle

    # Güvenlik başlıkları (tüm yanıtlara; hata yanıtları dahil "always").
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # NOT: Content-Security-Policy bilinçli eklenmedi — Next.js inline tema scripti (nonce/hash) gerektirir;
    # yanlış CSP uygulamayı bozar. Pilot sonrası nonce ile eklenebilir (SECURITY-REVIEW.md).

    # Gerçek istemci IP'si (backend ForwardedHeaders ile okur → rate limit doğru çalışır).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API — URI korunur (/api/... olduğu gibi backend'e gider).
    location /api/ {
        proxy_pass http://pliaforma_backend;
    }

    # Health
    location = /health {
        proxy_pass http://pliaforma_backend;
    }

    # Frontend (geri kalan her şey)
    location / {
        proxy_pass http://pliaforma_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

