# Pliaforma — Geliştirme stack'i (PostgreSQL + Backend + Frontend).
# Same-origin: tarayıcı frontend'e (:3000) gider; /api istekleri Next rewrite ile backend'e proxy'lenir.
# Native geliştirme (hot reload) için backend/frontend'i ayrı ayrı da çalıştırabilirsiniz.
#
#   docker compose -f docker-compose.dev.yml up --build
#   Frontend: http://localhost:3000   ·   Backend (doğrudan): http://localhost:5132/swagger

name: pliaforma-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pliaforma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pliaforma"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./pliaformaApi
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pliaforma;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-dev-only-secret-please-change-min-32-bytes!!}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@pliaforma.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin!2345}
      Cors__Origins__0: http://localhost:3000
      # Test/doğrulama ortamı e-posta doğrulamayı PROD gibi ZORLAR (smoke/E2E verification akışları yeşil kalsın).
      # Kullanıcının interaktif LOKAL dev'i (appsettings.Development.json) bunu false bırakır (onay beklemez).
      Auth__RequireEmailVerification: "true"
      # Sprint 28D: line ödeme hatırlatması per-studio per-run cap'i test ortamında 1 (throttle determinizmi; prod varsayılan 50).
      Notifications__LineReminderMaxPerStudioPerRun: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5132:8080" # doğrudan erişim (Swagger/debug); ana akış frontend proxy'sidir

  frontend:
    build:
      context: ./pliaformaFrontend
      args:
        BACKEND_ORIGIN: http://backend:8080
    environment:
      BACKEND_ORIGIN: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
