# Pliaforma — Production stack TASLAĞI (nginx tek giriş + backend + frontend + PostgreSQL).
# Tek genel port nginx'tir; backend/frontend dışarı port AÇMAZ. nginx yönlendirir:
#   /        → frontend (:3000)
#   /api/    → backend  (:8080)
#   /health  → backend  (:8080)
#
# Gizli değişkenler deploy/.env'den gelir (deploy/.env.example'ı kopyalayın).
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build

name: pliaforma-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./pliaformaApi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-Pliaforma}
      Jwt__Audience: ${JWT_AUDIENCE:-Pliaforma}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Cors__Origins__0: ${PUBLIC_ORIGIN}
      # MFA (Sprint 31-MFA): pilotta ZORUNLU. Mfa:Enabled=true + geçerli Mfa:EncryptionKey yoksa backend AÇILMAZ.
      Mfa__Enabled: ${MFA_ENABLED:-true}
      Mfa__EncryptionKey: ${MFA_ENCRYPTION_KEY}
      # Sprint 50: "bu cihazı hatırla" güven süresi (gün). MFA'yı KAPATMAZ; yalnız aynı cihazda 2. faktörü atlar.
      Mfa__TrustedDeviceDays: ${MFA_TRUSTED_DEVICE_DAYS:-30}
      # E-posta (Sprint 16) — prod'da SenderMode=Smtp önerilir; Smtp iken PublicOrigin/Host/From zorunlu (fail-fast).
      # PublicOrigin = kullanıcıya görünen origin (doğrulama/sıfırlama linkleri bununla kurulur).
      Email__SenderMode: ${EMAIL_SENDER_MODE:-Smtp}
      Email__PublicOrigin: ${PUBLIC_ORIGIN}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME:-Pliaforma}
      Email__Smtp__Host: ${SMTP_HOST}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME}
      Email__Smtp__Password: ${SMTP_PASSWORD}
      Email__Smtp__UseTls: ${SMTP_USE_TLS:-true}
      # Sprint 46/47: Pilot Simple People Mode (hoca ad-soyad guest öğrenci ekler; StudentContract/Line.IsPilot ile
      # gizlenir). Varsayılan KAPALI — yalnız pilot stüdyo için deploy/.env'de PILOT_SIMPLE_PEOPLE_MODE=true set edin.
      Pilot__SimplePeopleMode: ${PILOT_SIMPLE_PEOPLE_MODE:-false}
      # Sprint 49: herkese açık stüdyo kaydı (register-studio). Tek-salon pilotta KAPALI olmalı → PROD varsayılanı
      # false (operatör açıkça açmadıkça dışarıdan yeni stüdyo oluşturulamaz; 403). Tam SaaS için .env'de
      # STUDIO_REGISTRATION_ENABLED=true. Login, davet-kabul ve mevcut kullanıcı akışları bu flag'ten ETKİLENMEZ.
      Registration__StudioRegistrationEnabled: ${STUDIO_REGISTRATION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./pliaformaFrontend
      args:
        BACKEND_ORIGIN: http://backend:8080
    environment:
      BACKEND_ORIGIN: http://backend:8080
      # Sprint 31C-2: CSP modu (proxy.ts runtime okur). İlk deploy report-only; canlı doğrulama sonrası
      # CSP_MODE=enforce ile env-flip + restart (rebuild gerekmez). Acil rollback: report-only / disabled.
      CSP_MODE: ${CSP_MODE:-report-only}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS sertifikaları (repo'da YOK; operatör sağlar). deploy/certs/fullchain.pem + privkey.pem.
      # Sertifikalar yoksa nginx açılmaz (HTTPS zorunlu — bilinçli). Bkz. PILOT-DEPLOY-DRY-RUN.md.
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
