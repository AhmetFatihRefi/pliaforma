# Pliaforma — Production stack TASLAĞI (nginx tek giriş + backend + frontend + PostgreSQL).
# Tek genel port nginx'tir; backend/frontend dışarı port AÇMAZ. nginx yönlendirir:
#   /        → frontend (:3000)
#   /api/    → backend  (:8080)
#   /health  → backend  (:8080)
#
# Gizli değişkenler deploy/.env'den gelir (deploy/.env.example'ı kopyalayın).
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build

name: pliaforma-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./pliaformaApi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-Pliaforma}
      Jwt__Audience: ${JWT_AUDIENCE:-Pliaforma}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Cors__Origins__0: ${PUBLIC_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./pliaformaFrontend
      args:
        BACKEND_ORIGIN: http://backend:8080
    environment:
      BACKEND_ORIGIN: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      # TLS için 443'ü açın ve deploy/nginx.conf'taki HTTPS bloğunu etkinleştirin.
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
